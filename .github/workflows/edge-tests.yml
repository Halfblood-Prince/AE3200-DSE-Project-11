name: Edge Case Tests

on:
  push:
    branches:
      - main
      - master
      - structures_bending
    paths:
      - "*.py"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/edge-tests.yml"
  pull_request:
    paths:
      - "*.py"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/edge-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    name: Edge case tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run edge case tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/edge
