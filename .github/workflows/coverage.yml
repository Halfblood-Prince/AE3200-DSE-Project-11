name: Coverage

on:
  push:
    branches: [ros_simulation]
    paths-ignore:
      - .github/badges/coverage.json
  pull_request:
    branches: [ros_simulation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Pytest Coverage
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ROS test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-numpy \
            python3-pytest \
            python3-pytest-cov \
            python3-setuptools \
            ros-jazzy-geometry-msgs \
            ros-jazzy-nav-msgs \
            ros-jazzy-rclpy \
            ros-jazzy-sensor-msgs \
            ros-jazzy-tf2-ros

      - name: Build ROS package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      - name: Run pytest coverage
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          pytest --cov-fail-under=90

      - name: Update coverage badge data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_REMOTE_BADGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ros_simulation' }}
        shell: bash
        run: |
          python3 .github/scripts/update_coverage_badge.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
