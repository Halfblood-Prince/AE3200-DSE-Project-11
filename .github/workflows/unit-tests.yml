name: Unit Tests

on:
  push:
    branches:
      - main
      - master
      - Iterative_tool
    paths:
      - "structures/bending/*.py"
      - "structures/bending/tests/**"
      - "structures/bending/requirements*.txt"
      - "structures/bending/pyproject.toml"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "structures/bending/*.py"
      - "structures/bending/tests/**"
      - "structures/bending/requirements*.txt"
      - "structures/bending/pyproject.toml"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: structures/bending

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: structures/bending/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/unit
