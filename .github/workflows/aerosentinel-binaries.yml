name: AeroSentinel Linux Binaries

on:
  push:
    branches:
      - ros_simulation
    paths-ignore:
      - "bin/**"

permissions:
  actions: read
  contents: write

concurrency:
  group: aerosentinel-binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo
  PUBLISH_BRANCH: ros_simulation
  ROS_DISTRO: lyrical
  TARGET_UBUNTU_CODENAME: resolute

jobs:
  build:
    name: Build Ubuntu 26.04 ${{ matrix.bin_dir }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        # The host runner supplies CPU architecture; the job container supplies Ubuntu 26.04.
        include:
          - bin_dir: amd_x64
            runner: ubuntu-24.04
          - bin_dir: arm_x64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up ROS apt source
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl software-properties-common
          add-apt-repository -y universe
          ubuntu_codename="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}")"
          if [ "${ubuntu_codename}" != "${TARGET_UBUNTU_CODENAME}" ]; then
            echo "Expected Ubuntu codename ${TARGET_UBUNTU_CODENAME}, got ${ubuntu_codename}."
            exit 1
          fi
          ROS_APT_SOURCE_VERSION="$(curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | grep -F "tag_name" | awk -F'"' '{print $4}')"
          curl -L -o /tmp/ros2-testing-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-testing-apt-source_${ROS_APT_SOURCE_VERSION}.${ubuntu_codename}_all.deb"
          dpkg -i /tmp/ros2-testing-apt-source.deb

      - name: Install package dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            git \
            dpkg-dev \
            libc-ares-dev \
            libavcodec-dev \
            libavutil-dev \
            libbrotli-dev \
            libdrogon-dev \
            libhiredis-dev \
            libjsoncpp-dev \
            default-libmysqlclient-dev \
            libopencv-dev \
            libpq-dev \
            libsqlite3-dev \
            libssl-dev \
            libswscale-dev \
            libx264-dev \
            libyaml-cpp-dev \
            patchelf \
            pkg-config \
            uuid-dev \
            zlib1g-dev \
            python3-colcon-common-extensions \
            ros-${ROS_DISTRO}-action-msgs \
            ros-${ROS_DISTRO}-ament-cmake \
            ros-${ROS_DISTRO}-geometry-msgs \
            ros-${ROS_DISTRO}-nav-msgs \
            ros-${ROS_DISTRO}-nav2-msgs \
            ros-${ROS_DISTRO}-octomap-server \
            ros-${ROS_DISTRO}-rclcpp \
            ros-${ROS_DISTRO}-rclpy \
            ros-${ROS_DISTRO}-sensor-msgs \
            ros-${ROS_DISTRO}-sensor-msgs-py \
            ros-${ROS_DISTRO}-tf2-ros

      - name: Install libdatachannel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.22.6 --recursive --shallow-submodules \
            https://github.com/paullouisageneau/libdatachannel.git \
            "${RUNNER_TEMP}/libdatachannel"
          cmake -S "${RUNNER_TEMP}/libdatachannel" \
            -B "${RUNNER_TEMP}/libdatachannel_build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DNO_EXAMPLES=ON \
            -DNO_TESTS=ON
          cmake --build "${RUNNER_TEMP}/libdatachannel_build" --parallel
          cmake --install "${RUNNER_TEMP}/libdatachannel_build"
          ldconfig

      - name: Verify CMake packages
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(dependency_probe LANGUAGES CXX)
          list(APPEND CMAKE_MODULE_PATH "$ENV{GITHUB_WORKSPACE}/website/cmake")
          include(AeroSentinelMySQLHints)
          find_package(Drogon CONFIG REQUIRED)
          find_package(FFmpeg REQUIRED COMPONENTS AVCODEC AVUTIL SWSCALE)
          find_package(LibDataChannel CONFIG REQUIRED)
          EOF
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          mysql_include_dir="$(mysql_config --variable=pkgincludedir 2>/dev/null || true)"
          if [ -z "${mysql_include_dir}" ]; then
            mysql_include_dir="$(mysql_config --include | tr ' ' '\n' | sed -n 's/^-I//p' | head -n1)"
          fi
          mysql_lib_dir="$(mysql_config --variable=pkglibdir 2>/dev/null || true)"
          if [ -z "${mysql_lib_dir}" ]; then
            mysql_lib_dir="$(mysql_config --libs | tr ' ' '\n' | sed -n 's/^-L//p' | head -n1)"
          fi
          mysql_library="$(find "/usr/lib/${multiarch}" /usr/lib -maxdepth 2 \( -name 'libmysqlclient.so' -o -name 'libmariadb.so' \) -print -quit)"
          if [ -z "${mysql_lib_dir}" ] && [ -n "${mysql_library}" ]; then
            mysql_lib_dir="$(dirname "${mysql_library}")"
          fi
          for required_var in mysql_include_dir mysql_lib_dir mysql_library; do
            if [ -z "${!required_var}" ]; then
              echo "Unable to resolve ${required_var}."
              exit 1
            fi
          done
          cmake -S "${RUNNER_TEMP}" -B "${RUNNER_TEMP}/dependency_probe_build" -Wno-dev \
            -DCMAKE_INCLUDE_PATH="${mysql_include_dir}" \
            -DCMAKE_LIBRARY_PATH="${mysql_lib_dir}" \
            -DMYSQL_INCLUDE_DIR="${mysql_include_dir}" \
            -DMYSQL_INCLUDE_DIRS="${mysql_include_dir}" \
            -DMARIADB_INCLUDE_DIRS="${mysql_include_dir}" \
            -DMYSQL_LIB_DIR="${mysql_lib_dir}" \
            -DMYSQL_LIBRARY_DIR="${mysql_lib_dir}" \
            -DMYSQL_LIBRARY="${mysql_library}" \
            -DMYSQL_LIBRARIES="${mysql_library}"

      - name: Build ROS 2 package from source
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          mysql_include_dir="$(mysql_config --variable=pkgincludedir 2>/dev/null || true)"
          if [ -z "${mysql_include_dir}" ]; then
            mysql_include_dir="$(mysql_config --include | tr ' ' '\n' | sed -n 's/^-I//p' | head -n1)"
          fi
          mysql_lib_dir="$(mysql_config --variable=pkglibdir 2>/dev/null || true)"
          if [ -z "${mysql_lib_dir}" ]; then
            mysql_lib_dir="$(mysql_config --libs | tr ' ' '\n' | sed -n 's/^-L//p' | head -n1)"
          fi
          mysql_library="$(find "/usr/lib/${multiarch}" /usr/lib -maxdepth 2 \( -name 'libmysqlclient.so' -o -name 'libmariadb.so' \) -print -quit)"
          if [ -z "${mysql_lib_dir}" ] && [ -n "${mysql_library}" ]; then
            mysql_lib_dir="$(dirname "${mysql_library}")"
          fi
          hiredis_include_dir="$(pkg-config --variable=includedir hiredis 2>/dev/null || true)"
          if [ -z "${hiredis_include_dir}" ]; then
            hiredis_include_dir="/usr/include"
          fi
          hiredis_library="$(find "/usr/lib/${multiarch}" /usr/lib -maxdepth 2 -name 'libhiredis.so' -print -quit)"
          for required_var in mysql_include_dir mysql_lib_dir mysql_library hiredis_include_dir hiredis_library; do
            if [ -z "${!required_var}" ]; then
              echo "Unable to resolve ${required_var}."
              exit 1
            fi
          done
          echo "mysql_include_dir=${mysql_include_dir}"
          echo "mysql_lib_dir=${mysql_lib_dir}"
          echo "mysql_library=${mysql_library}"
          echo "hiredis_include_dir=${hiredis_include_dir}"
          echo "hiredis_library=${hiredis_library}"
          mkdir -p "${RUNNER_TEMP}/ros_ws/src"
          ln -s "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/ros_ws/src/ros_test"
          cd "${RUNNER_TEMP}/ros_ws"
          colcon build \
            --packages-select ros_test \
            --event-handlers console_direct+ \
            --cmake-args \
              -DROS_TEST_USE_PREBUILT_BINARIES=OFF \
              -DCMAKE_INCLUDE_PATH="${mysql_include_dir}" \
              -DCMAKE_LIBRARY_PATH="${mysql_lib_dir}" \
              -DMYSQL_INCLUDE_DIR="${mysql_include_dir}" \
              -DMYSQL_INCLUDE_DIRS="${mysql_include_dir}" \
              -DMARIADB_INCLUDE_DIRS="${mysql_include_dir}" \
              -DMYSQL_LIB_DIR="${mysql_lib_dir}" \
              -DMYSQL_LIBRARY_DIR="${mysql_lib_dir}" \
              -DMYSQL_LIBRARY="${mysql_library}" \
              -DMYSQL_LIBRARIES="${mysql_library}" \
              -DHIREDIS_INCLUDE_DIR="${hiredis_include_dir}" \
              -DHIREDIS_LIBRARY="${hiredis_library}" \
              -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"

      - name: Show colcon logs on failure
        if: failure()
        shell: bash
        run: |
          log_dir="${RUNNER_TEMP}/ros_ws/log/latest_build/ros_test"
          if [ -d "${log_dir}" ]; then
            find "${log_dir}" -maxdepth 1 -type f -print -exec sed -n '1,220p' {} \;
          else
            echo "No ros_test colcon log directory found at ${log_dir}"
          fi

      - name: Clear and populate binary folder
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u
          package_dir="${GITHUB_WORKSPACE}/bin/${{ matrix.bin_dir }}"
          ubuntu_codename="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}")"
          ubuntu_version_id="$(. /etc/os-release && echo "${VERSION_ID}")"
          if [ "${ubuntu_codename}" != "${TARGET_UBUNTU_CODENAME}" ]; then
            echo "Expected Ubuntu codename ${TARGET_UBUNTU_CODENAME}, got ${ubuntu_codename}."
            exit 1
          fi
          case "${package_dir}" in
            "${GITHUB_WORKSPACE}/bin/"*) ;;
            *) echo "Refusing to clean unexpected package_dir=${package_dir}"; exit 1 ;;
          esac
          mkdir -p "${package_dir}"
          find "${package_dir}" -mindepth 1 -maxdepth 1 ! -name .gitignore -exec rm -rf -- {} +
          required_executables=(web_server)
          for executable in "${required_executables[@]}"; do
            cp "${RUNNER_TEMP}/ros_ws/install/ros_test/lib/ros_test/${executable}" "${package_dir}/"
            chmod +x "${package_dir}/${executable}"
          done
          {
            echo "BIN_ARCH=${{ matrix.bin_dir }}"
            echo "SOURCE_COMMIT=${GITHUB_SHA}"
            echo "ROS_DISTRO=${ROS_DISTRO}"
            echo "UBUNTU_CODENAME=${ubuntu_codename}"
            echo "UBUNTU_VERSION_ID=${ubuntu_version_id}"
            echo "BUILD_TYPE=${BUILD_TYPE}"
          } > "${package_dir}/build-info.env"
          patchelf --set-rpath '$ORIGIN/lib:$ORIGIN' "${package_dir}/web_server"

          mkdir -p "${package_dir}/lib"
          ldd "${package_dir}/web_server" | awk '
            $2 == "=>" && $3 ~ /^\// { print $3 }
            $1 ~ /^\// { print $1 }
          ' | sort -u > "${RUNNER_TEMP}/web_server.ldd"

          while IFS= read -r dependency; do
            [ -f "${dependency}" ] || continue
            case "${dependency}" in
              /opt/ros/*) continue ;;
            esac

            name="$(basename "${dependency}")"
            case "${name}" in
              ld-linux-*|libc.so.*|libdl.so.*|libgcc_s.so.*|libm.so.*|libpthread.so.*|libresolv.so.*|librt.so.*|libstdc++.so.*)
                continue
                ;;
            esac

            cp -L "${dependency}" "${package_dir}/lib/${name}"
            chmod u+w "${package_dir}/lib/${name}" || true
          done < "${RUNNER_TEMP}/web_server.ldd"

          find "${package_dir}/lib" -type f -name "*.so*" -print0 | while IFS= read -r -d '' library; do
            patchelf --set-rpath '$ORIGIN' "${library}" || true
          done

          if ! find "${package_dir}/lib" -type f -name "*.so*" -print -quit | grep -q .; then
            echo "No web_server dependency libraries were bundled."
            exit 1
          fi

          ldd "${package_dir}/web_server" > "${RUNNER_TEMP}/web_server.final.ldd"
          if grep -q "not found" "${RUNNER_TEMP}/web_server.final.ldd"; then
            cat "${RUNNER_TEMP}/web_server.final.ldd"
            exit 1
          fi

      - name: Verify generated client bundle
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u
          package_dir="${GITHUB_WORKSPACE}/bin/${{ matrix.bin_dir }}"
          required_executables=(web_server)
          python_executables=(
            auto_drive
            map_filter
            map_monitor
            nav2_waypoint_explorer
            odom_to_tf
          )

          for executable in "${required_executables[@]}"; do
            test -x "${package_dir}/${executable}"
          done
          test -f "${package_dir}/build-info.env"
          grep -qx "BIN_ARCH=${{ matrix.bin_dir }}" "${package_dir}/build-info.env"
          grep -qx "ROS_DISTRO=${ROS_DISTRO}" "${package_dir}/build-info.env"
          grep -qx "UBUNTU_CODENAME=${TARGET_UBUNTU_CODENAME}" "${package_dir}/build-info.env"
          test -d "${package_dir}/lib"
          find "${package_dir}/lib" -type f -name "*.so*" -print -quit | grep -q .

          mkdir -p "${RUNNER_TEMP}/client_ws/src"
          ln -s "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/client_ws/src/ros_test"
          cd "${RUNNER_TEMP}/client_ws"
          colcon build \
            --packages-select ros_test \
            --event-handlers console_direct+

          install_dir="${RUNNER_TEMP}/client_ws/install/ros_test/lib/ros_test"
          for executable in "${required_executables[@]}"; do
            test -x "${install_dir}/${executable}"
            cmp "${package_dir}/${executable}" "${install_dir}/${executable}"
          done
          for executable in "${python_executables[@]}"; do
            test -x "${install_dir}/${executable}"
          done
          test -d "${install_dir}/lib"
          find "${install_dir}/lib" -type f -name "*.so*" -print -quit | grep -q .
          ldd "${install_dir}/web_server" > "${RUNNER_TEMP}/client_web_server.ldd"
          if grep -q "not found" "${RUNNER_TEMP}/client_web_server.ldd"; then
            cat "${RUNNER_TEMP}/client_web_server.ldd"
            exit 1
          fi

      - name: Show client build logs on failure
        if: failure()
        shell: bash
        run: |
          log_dir="${RUNNER_TEMP}/client_ws/log/latest_build/ros_test"
          if [ -d "${log_dir}" ]; then
            find "${log_dir}" -maxdepth 1 -type f -print -exec sed -n '1,220p' {} \;
          else
            echo "No client ros_test colcon log directory found at ${log_dir}"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ros_test-${{ matrix.bin_dir }}
          path: bin/${{ matrix.bin_dir }}
          if-no-files-found: error

  publish:
    name: Publish binaries to repository
    needs: build
    if: github.ref == 'refs/heads/ros_simulation'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PUBLISH_BRANCH }}

      - name: Clear repository binary folders
        shell: bash
        run: |
          set -euo pipefail
          for package_dir in \
            "${GITHUB_WORKSPACE}/bin/amd_x64" \
            "${GITHUB_WORKSPACE}/bin/arm_x64"
          do
            case "${package_dir}" in
              "${GITHUB_WORKSPACE}/bin/"*) ;;
              *) echo "Refusing to clean unexpected package_dir=${package_dir}"; exit 1 ;;
            esac
            mkdir -p "${package_dir}"
            find "${package_dir}" -mindepth 1 -maxdepth 1 ! -name .gitignore -exec rm -rf -- {} +
          done

      - name: Download amd_x64 binaries
        uses: actions/download-artifact@v4
        with:
          name: ros_test-amd_x64
          path: bin/amd_x64

      - name: Download arm_x64 binaries
        uses: actions/download-artifact@v4
        with:
          name: ros_test-arm_x64
          path: bin/arm_x64

      - name: Verify downloaded binary bundles
        shell: bash
        run: |
          set -euo pipefail
          required_executables=(web_server)

          for package_dir in bin/amd_x64 bin/arm_x64; do
            bin_arch="$(basename "${package_dir}")"
            test -f "${package_dir}/build-info.env"
            grep -qx "BIN_ARCH=${bin_arch}" "${package_dir}/build-info.env"
            grep -qx "ROS_DISTRO=${ROS_DISTRO}" "${package_dir}/build-info.env"
            grep -qx "UBUNTU_CODENAME=${TARGET_UBUNTU_CODENAME}" "${package_dir}/build-info.env"
            test -d "${package_dir}/lib"
            find "${package_dir}/lib" -type f -name "*.so*" -print -quit | grep -q .
            for executable in "${required_executables[@]}"; do
              chmod +x "${package_dir}/${executable}"
              test -x "${package_dir}/${executable}"
            done
            chmod 0644 "${package_dir}/build-info.env"
          done

      - name: Commit binaries
        shell: bash
        run: |
          set -euo pipefail
          for package_dir in bin/amd_x64 bin/arm_x64; do
            chmod +x "${package_dir}/web_server"
            chmod 0644 "${package_dir}/build-info.env"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f bin/amd_x64 bin/arm_x64
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
            exit 0
          fi
          git commit -m "Update Linux binary artifacts [skip ci]"
          git push origin HEAD:${PUBLISH_BRANCH}
