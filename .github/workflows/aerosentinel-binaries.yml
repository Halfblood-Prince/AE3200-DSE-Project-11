name: AeroSentinel Linux Binaries

on:
  push:
    branches:
      - ak/ros2
    paths:
      - ".github/workflows/**"
      - "CMakeLists.txt"
      - "package.xml"
      - "src/**"
      - "website/**"
  pull_request:
    branches:
      - ak/ros2
    paths:
      - ".github/workflows/**"
      - "CMakeLists.txt"
      - "package.xml"
      - "src/**"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aerosentinel-binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo
  ROS_DISTRO: jazzy

jobs:
  build:
    name: Build Linux ${{ matrix.bin_dir }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - bin_dir: amd_x64
            runner: ubuntu-24.04
          - bin_dir: arm_x64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ env.ROS_DISTRO }}

      - name: Install package dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            libc-ares-dev \
            libbrotli-dev \
            libdrogon-dev \
            libhiredis-dev \
            libjsoncpp-dev \
            libmariadb-dev \
            libmariadb-dev-compat \
            libopencv-dev \
            libpq-dev \
            libsqlite3-dev \
            libssl-dev \
            pkg-config \
            uuid-dev \
            zlib1g-dev \
            python3-colcon-common-extensions \
            ros-${ROS_DISTRO}-ament-cmake \
            ros-${ROS_DISTRO}-geometry-msgs \
            ros-${ROS_DISTRO}-nav-msgs \
            ros-${ROS_DISTRO}-nav2-msgs \
            ros-${ROS_DISTRO}-rclcpp \
            ros-${ROS_DISTRO}-rclcpp-action \
            ros-${ROS_DISTRO}-sensor-msgs \
            ros-${ROS_DISTRO}-tf2 \
            ros-${ROS_DISTRO}-tf2-ros

      - name: Verify Drogon CMake package
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(drogon_probe LANGUAGES CXX)
          find_package(Drogon CONFIG REQUIRED)
          EOF
          cmake -S "${RUNNER_TEMP}" -B "${RUNNER_TEMP}/drogon_probe_build" -Wno-dev

      - name: Build ROS 2 package from source
        shell: bash
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          mysql_include_dir="$(mysql_config --variable=pkgincludedir 2>/dev/null || true)"
          if [ -z "${mysql_include_dir}" ]; then
            mysql_include_dir="$(mysql_config --include | tr ' ' '\n' | sed -n 's/^-I//p' | head -n1)"
          fi
          mysql_lib_dir="$(mysql_config --variable=pkglibdir 2>/dev/null || true)"
          if [ -z "${mysql_lib_dir}" ]; then
            mysql_lib_dir="$(mysql_config --libs | tr ' ' '\n' | sed -n 's/^-L//p' | head -n1)"
          fi
          mysql_library="$(find "/usr/lib/${multiarch}" /usr/lib -maxdepth 2 \( -name 'libmysqlclient.so' -o -name 'libmariadb.so' \) -print -quit)"
          hiredis_include_dir="$(pkg-config --variable=includedir hiredis 2>/dev/null || true)"
          if [ -z "${hiredis_include_dir}" ]; then
            hiredis_include_dir="/usr/include"
          fi
          hiredis_library="$(find "/usr/lib/${multiarch}" /usr/lib -maxdepth 2 -name 'libhiredis.so' -print -quit)"
          echo "mysql_include_dir=${mysql_include_dir}"
          echo "mysql_lib_dir=${mysql_lib_dir}"
          echo "mysql_library=${mysql_library}"
          echo "hiredis_include_dir=${hiredis_include_dir}"
          echo "hiredis_library=${hiredis_library}"
          mkdir -p "${RUNNER_TEMP}/ros_ws/src"
          ln -s "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/ros_ws/src/ros_test"
          cd "${RUNNER_TEMP}/ros_ws"
          colcon build \
            --packages-select ros_test \
            --event-handlers console_direct+ \
            --cmake-args \
              -DROS_TEST_USE_PREBUILT_BINARIES=OFF \
              -DMYSQL_INCLUDE_DIR="${mysql_include_dir}" \
              -DMYSQL_LIB_DIR="${mysql_lib_dir}" \
              -DMYSQL_LIBRARY_DIR="${mysql_lib_dir}" \
              -DMYSQL_LIBRARY="${mysql_library}" \
              -DHIREDIS_INCLUDE_DIR="${hiredis_include_dir}" \
              -DHIREDIS_LIBRARY="${hiredis_library}" \
              -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"

      - name: Show colcon logs on failure
        if: failure()
        shell: bash
        run: |
          log_dir="${RUNNER_TEMP}/ros_ws/log/latest_build/ros_test"
          if [ -d "${log_dir}" ]; then
            find "${log_dir}" -maxdepth 1 -type f -print -exec sed -n '1,220p' {} \;
          else
            echo "No ros_test colcon log directory found at ${log_dir}"
          fi

      - name: Stage binary folder
        shell: bash
        run: |
          package_dir="${GITHUB_WORKSPACE}/bin/${{ matrix.bin_dir }}"
          case "${package_dir}" in
            "${GITHUB_WORKSPACE}/bin/"*) ;;
            *) echo "Refusing to clean unexpected package_dir=${package_dir}"; exit 1 ;;
          esac
          mkdir -p "${package_dir}"
          find "${package_dir}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          for executable in \
            auto_drive \
            map_filter \
            map_monitor \
            nav2_waypoint_explorer \
            odom_to_tf \
            scan_to_chassis \
            simple_mapper \
            web_server
          do
            cp "${RUNNER_TEMP}/ros_ws/install/ros_test/lib/ros_test/${executable}" "${package_dir}/"
            chmod +x "${package_dir}/${executable}"
          done

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ros_test-${{ matrix.bin_dir }}
          path: bin/${{ matrix.bin_dir }}
          if-no-files-found: error
