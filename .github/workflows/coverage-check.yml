name: Coverage Check

on:
  push:
    branches:
      - main
      - master
      - Iterative_tool
    paths:
      - "Sizing_tool.py"
      - "EPS/**"
      - "propulsion/**"
      - "structures/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".coveragerc"
      - "structures/bending/pyproject.toml"
      - ".github/workflows/coverage-check.yml"
  pull_request:
    paths:
      - "Sizing_tool.py"
      - "EPS/**"
      - "propulsion/**"
      - "structures/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".coveragerc"
      - "structures/bending/pyproject.toml"
      - ".github/workflows/coverage-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Repository coverage threshold
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Enforce repository coverage
        env:
          MPLBACKEND: Agg
        run: python tests/run_coverage.py --xml --threshold 90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: repository-coverage
          path: coverage.xml
