name: Coverage Check

on:
  push:
    branches:
      - main
      - master
      - structures_bending
    paths:
      - "bending.py"
      - "materials.py"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/coverage-check.yml"
  pull_request:
    paths:
      - "bending.py"
      - "materials.py"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/coverage-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Bending coverage threshold
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Enforce branch coverage
        env:
          MPLBACKEND: Agg
        run: >
          python -m pytest
          --cov=bending
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: bending-coverage
          path: coverage.xml
