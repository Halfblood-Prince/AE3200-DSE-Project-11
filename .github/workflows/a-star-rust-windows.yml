name: A* Native Windows Binaries

on:
  push:
    branches:
      - ros_simulation
    paths:
      - "dummy_files/a.py"
      - "dummy_files/a.rs"
      - "dummy_files/a.cpp"
      - ".github/workflows/a-star-rust-windows.yml"
  pull_request:
    paths:
      - "dummy_files/a.py"
      - "dummy_files/a.rs"
      - "dummy_files/a.cpp"
      - ".github/workflows/a-star-rust-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a-star-native-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows amd64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          rustup target add x86_64-pc-windows-msvc

      - name: Compile Rust executable and DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows-amd64 | Out-Null

          rustc --edition 2021 `
            --target x86_64-pc-windows-msvc `
            -C opt-level=3 `
            -C target-cpu=x86-64 `
            dummy_files\a.rs `
            -o dist\windows-amd64\a_star_rust.exe

          rustc --edition 2021 `
            --target x86_64-pc-windows-msvc `
            --crate-type cdylib `
            -C opt-level=3 `
            -C target-cpu=x86-64 `
            dummy_files\a.rs `
            -o dist\windows-amd64\a_star_rust.dll

      - name: Compile C++ executable and DLL
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALLDIR=%%i
          call "%VSINSTALLDIR%\VC\Auxiliary\Build\vcvars64.bat"

          cl /nologo /EHsc /std:c++17 /O2 /MT ^
            dummy_files\a.cpp ^
            /Fo:dist\windows-amd64\a_star_cpp_exe.obj ^
            /Fe:dist\windows-amd64\a_star_cpp.exe

          cl /nologo /EHsc /std:c++17 /O2 /MT /LD ^
            dummy_files\a.cpp ^
            /Fo:dist\windows-amd64\a_star_cpp_dll.obj ^
            /Fe:dist\windows-amd64\a_star_cpp.dll ^
            /link /IMPLIB:dist\windows-amd64\a_star_cpp.lib

      - name: Verify executable outputs
        shell: pwsh
        run: |
          foreach ($binary in @(
            ".\dist\windows-amd64\a_star_rust.exe",
            ".\dist\windows-amd64\a_star_cpp.exe"
          )) {
            $output = & $binary --json
            $result = $output | ConvertFrom-Json

            if ($result.path_length -ne 14) {
              throw "$binary expected path_length 14, got $($result.path_length)"
            }

            if ($result.path.Count -ne 15) {
              throw "$binary expected 15 path positions, got $($result.path.Count)"
            }
          }

      - name: Verify Python native integrations
        shell: pwsh
        run: |
          python -m pip install numpy
          python dummy_files\a.py --implementation rust --rust-lib dist\windows-amd64\a_star_rust.dll
          python dummy_files\a.py --implementation cpp --cpp-lib dist\windows-amd64\a_star_cpp.dll
          python dummy_files\a.py --benchmark --iterations 10 --rust-lib dist\windows-amd64\a_star_rust.dll --cpp-lib dist\windows-amd64\a_star_cpp.dll

      - name: Upload Windows amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-star-native-windows-amd64
          path: |
            dist/windows-amd64/a_star_rust.exe
            dist/windows-amd64/a_star_rust.dll
            dist/windows-amd64/a_star_cpp.exe
            dist/windows-amd64/a_star_cpp.dll
          if-no-files-found: error
