name: A* Rust Windows Binary

on:
  push:
    branches:
      - ros_simulation
    paths:
      - "dummy_files/a.rs"
      - ".github/workflows/a-star-rust-windows.yml"
  pull_request:
    paths:
      - "dummy_files/a.rs"
      - ".github/workflows/a-star-rust-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a-star-rust-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows amd64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          rustup target add x86_64-pc-windows-msvc

      - name: Compile executable and DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows-amd64 | Out-Null

          rustc --edition 2021 `
            --target x86_64-pc-windows-msvc `
            -C opt-level=3 `
            -C target-cpu=x86-64 `
            dummy_files\a.rs `
            -o dist\windows-amd64\a_star_rust.exe

          rustc --edition 2021 `
            --target x86_64-pc-windows-msvc `
            --crate-type cdylib `
            -C opt-level=3 `
            -C target-cpu=x86-64 `
            dummy_files\a.rs `
            -o dist\windows-amd64\a_star_rust.dll

      - name: Verify executable output
        shell: pwsh
        run: |
          $output = .\dist\windows-amd64\a_star_rust.exe --json
          $result = $output | ConvertFrom-Json

          if ($result.path_length -ne 14) {
            throw "Expected path_length 14, got $($result.path_length)"
          }

          if ($result.path.Count -ne 15) {
            throw "Expected 15 path positions, got $($result.path.Count)"
          }

      - name: Verify Python Rust integration
        shell: pwsh
        run: |
          python -m pip install numpy
          python dummy_files\a.py --implementation rust --rust-lib dist\windows-amd64\a_star_rust.dll
          python dummy_files\a.py --benchmark --iterations 10 --rust-lib dist\windows-amd64\a_star_rust.dll

      - name: Upload Windows amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-star-rust-windows-amd64
          path: dist/windows-amd64/
          if-no-files-found: error
