name: Bending Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - "bending.py"
      - "materials.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/bending-tests.yml"
  pull_request:
    paths:
      - "bending.py"
      - "materials.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/bending-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bending-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.test-layer }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-layer:
          - unit
          - subsystem
          - system
          - edge

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run ${{ matrix.test-layer }} tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/${{ matrix.test-layer }}

  coverage:
    name: Bending coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with branch coverage
        env:
          MPLBACKEND: Agg
        run: >
          python -m pytest
          --cov=bending
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: bending-coverage
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: bending
          fail_ci_if_error: true
          use_oidc: true
