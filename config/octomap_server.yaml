octomap_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    base_frame_id: base_link
    resolution: 0.05
    point_cloud_min_z: 0.05
    point_cloud_max_z: 2.0
    occupancy_min_z: 0.05
    occupancy_max_z: 2.0
    filter_ground_plane: false
    filter_speckles: true
    incremental_2D_projection: true
    latch: true
    sensor_model:
      max_range: 12.0
