# OctoMap turns the filtered 3D lidar cloud into a voxel map and a 2D projection.
octomap_server:
  ros__parameters:
    # Simulation time keeps map timestamps aligned with Gazebo.
    use_sim_time: true

    # TF frames: /points_filtered arrives in lidar_link and is transformed through base_link.
    frame_id: map
    base_frame_id: base_link

    # Keep real 3D voxels fine enough for indoor obstacles without exploding map size.
    resolution: 0.05

    # Height limits keep floor noise and extreme ceiling returns out of the map.
    point_cloud_min_z: 0.10
    point_cloud_max_z: 3.0
    occupancy_min_z: 0.10
    occupancy_max_z: 3.0

    # Ground filtering and speckle removal keep the map focused on real obstacles.
    filter_ground_plane: true
    filter_speckles: true
    ground_filter:
      distance: 0.04
      angle: 0.15
      plane_distance: 0.10

    # The 2D projection feeds map consumers while the 3D voxel markers feed RViz.
    incremental_2D_projection: true
    latch: true
    sensor_model:
      # Match the lidar max range in robot.sdf.
      max_range: 12.0
      hit: 0.70
      miss: 0.40
      min: 0.12
      max: 0.97
